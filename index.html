<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منصة الحجز - الأستاذة []</title>
    <link rel="stylesheet" href="scine1.css" />
  </head>
  <body>
    <header>
      <h1>منصة حجز الدروس التعليمية</h1>
      <p>مع الأستاذة / [] - مدرسة [Scine]</p>
    </header>

    <main class="container">
      <section class="booking-card">
        <h2>استمارة حجز درس</h2>
        <form id="bookingForm">
          <div class="form-group">
            <label>اسم الطالب رباعي:</label>
            <input
              type="text"
              id="studentName"
              placeholder="أدخل اسمك بالكامل"
              required
            />
          </div>

          <div class="form-group">
            <label>رقم هاتف الطالب (واتساب):</label>
            <input
              type="tel"
              id="studentPhone"
              placeholder="01xxxxxxxxx"
              required
            />
          </div>

          <div class="form-group">
            <label>رقم هاتف ولي الأمر:</label>
            <input
              type="tel"
              id="parentPhone"
              placeholder="01xxxxxxxxx"
              required
            />
          </div>

          <div class="form-group">
            <label>المرحلة الدراسية:</label>
            <select id="grade" required>
              <option value="">اختر الصف الدراسي...</option>
              <option value="الأول الإعدادي">الصف الأول الإعدادي</option>
              <option value="الثاني الإعدادي">الصف الثاني الإعدادي</option>
              <option value="الثالث الإعدادي">الصف الثالث الإعدادي</option>
              <option value="الأول الثانوي">الصف الأول الثانوي</option>
            </select>
          </div>

          <div class="form-group">
            <label>الموعد المناسب:</label>
            <select id="timeSlot" required>
              <option value="">اختر الموعد...</option>
              <option value="الأحد والأربعاء - 4 مساءً">
                الأحد والأربعاء - 4 مساءً
              </option>
              <option value="الإثنين والخميس - 6 مساءً">
                الإثنين والخميس - 6 مساءً
              </option>
            </select>
          </div>

          <button type="submit" class="btn-submit">
            تأكيد الحجز عبر الواتساب 💬
          </button>
        </form>
      </section>
    </main>

    <script src="scine2.js"></script>
  </body>
</html>
